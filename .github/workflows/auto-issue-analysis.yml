name: Auto Issue Analysis

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate analysis
        id: analysis
        run: |
          TITLE="${{ github.event.issue.title }}"
          BODY="${{ github.event.issue.body }}"
          
          PROMPT="Analise essa issue e estruture uma resposta:\n\nTítulo: $TITLE\nDescrição: $BODY\n\nResponda com:\n## 📋 Resumo\n## 🎯 Objetivo\n## 📝 Detalhes\n## ✅ Critérios de Aceição"
          
          echo "analysis<<EOF" >> $GITHUB_OUTPUT
          echo "$PROMPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "## 🤖 Análise Auto-gerada\n\n${{ steps.analysis.outputs.analysis }}"
